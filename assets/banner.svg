<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Single Bet Placement QA: 6 scenarios, 18 bugs (3 critical), 3 automated tests">
  <style>
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 700 40px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 1px; }
    .stats { fill: #1f2328; font: 600 22px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .crit { fill: #cf222e; }
    .stack { fill: #59636e; font: 400 17px ui-monospace, "Cascadia Code", Consolas, monospace; }
    .accent { fill: #1a7f37; }
    .odd { fill: #ffffff; stroke: #d0d7de; }
    .odd-on { fill: #1a7f37; }
    .odd-label { fill: #59636e; font: 600 14px system-ui, "Segoe UI", sans-serif; }
    .odd-value { fill: #1f2328; font: 700 22px system-ui, "Segoe UI", sans-serif; }
    .odd-on-text { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151b23; stroke: #3d444d; }
      .title, .stats, .odd-value { fill: #f0f6fc; }
      .crit { fill: #ff7b72; }
      .stack, .odd-label { fill: #9198a1; }
      .accent, .odd-on { fill: #3fb950; }
      .odd { fill: #0d1117; stroke: #3d444d; }
      .odd-on-text { fill: #0d1117; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="198" rx="14"/>
  <rect class="accent" x="1" y="1" width="10" height="198" rx="5"/>

  <text class="title" x="48" y="72">SINGLE BET PLACEMENT · QA</text>
  <text class="stats" x="48" y="118">6 scenarios  ·  18 bugs (<tspan class="crit">3 critical</tspan>)  ·  3 automated tests</text>
  <text class="stack" x="48" y="160">Python · Selenium · pytest · requests · GitHub Actions</text>

  <!-- 1 X 2 odds buttons, HOME selected -->
  <g transform="translate(880 58)">
    <rect class="odd-on" x="0" y="0" width="90" height="84" rx="10"/>
    <text class="odd-label odd-on-text" x="45" y="30" text-anchor="middle">1</text>
    <text class="odd-value odd-on-text" x="45" y="62" text-anchor="middle">2.75</text>

    <rect class="odd" x="104" y="0" width="90" height="84" rx="10"/>
    <text class="odd-label" x="149" y="30" text-anchor="middle">X</text>
    <text class="odd-value" x="149" y="62" text-anchor="middle">3.35</text>

    <rect class="odd" x="208" y="0" width="90" height="84" rx="10"/>
    <text class="odd-label" x="253" y="30" text-anchor="middle">2</text>
    <text class="odd-value" x="253" y="62" text-anchor="middle">2.40</text>
  </g>
</svg>
